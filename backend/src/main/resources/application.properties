# Server Configuration
server.port=${PORT:8080}

# PostgreSQL Cloud Datasource Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ucmsdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:defaultSecretKeyForUCMSDevelopmentOnlyDoNotUseInProduction32Chars!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# FastAPI AI Service Configuration
app.ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
