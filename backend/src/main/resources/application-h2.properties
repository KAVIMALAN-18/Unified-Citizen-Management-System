# H2 File-based Datasource Configuration for Local Development
spring.datasource.url=jdbc:h2:file:./data/ucmsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security & AI Service
app.jwt.secret=${JWT_SECRET:defaultSecretKeyForUCMSDevelopmentOnlyDoNotUseInProduction32Chars!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
