# Test H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:ucmstest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test JWT Configuration
app.jwt.secret=testSecretKeyForUCMSDevelopmentTestingPurposesOnly32BytesLong!
app.jwt.expiration-ms=86400000

# Test FastAPI AI Service configuration
app.ai.service.url=http://localhost:8000
